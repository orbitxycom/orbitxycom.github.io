<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk</title>
<style>
  :root{
    --bg: #ffffff;
    --surface: #f4f5f7;
    --surface-2: #eceef1;
    --accent: #8b5cf6;
    --accent-dim: rgba(139,92,246,0.12);
    --text: #16181c;
    --text-dim: #8a919a;
    --border: #e4e6e9;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .content {
    padding: 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .brand-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 32px;
  }
  .brand-logo {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: var(--accent-dim);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .brand-logo svg { width: 32px; height: 32px; }
  .brand-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .brand-sub {
    font-size: 14px;
    color: var(--text-dim);
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 24px;
  }

  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }
  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrap svg.icon {
    position: absolute;
    left: 14px;
    width: 18px;
    height: 18px;
    color: var(--text-dim);
    pointer-events: none;
  }
  .field input {
    width: 100%;
    height: 50px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: #ffffff;
    padding: 0 14px 0 42px;
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input::placeholder { color: var(--text-dim); }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-dim);
  }
  .toggle-pass {
    position: absolute;
    right: 14px;
    width: 20px;
    height: 20px;
    color: var(--text-dim);
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .toggle-pass svg { width: 20px; height: 20px; }

  .row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 4px 0 20px;
  }
  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }
  .remember input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  .forgot-link {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
  }

  .btn-login {
    width: 100%;
    height: 52px;
    border-radius: 16px;
    border: none;
    background: var(--accent);
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    box-shadow: 0 8px 20px rgba(139,92,246,0.30);
  }
  .btn-login:active { transform: scale(0.97); }

  .error-msg {
    display: none;
    font-size: 13px;
    color: var(--danger);
    background: rgba(239,68,68,0.10);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 16px;
  }
  .error-msg.show { display: block; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: var(--text-dim);
    font-size: 12.5px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .signup-row {
    text-align: center;
    font-size: 13.5px;
    color: var(--text-dim);
    margin-top: 24px;
  }
  .signup-row a {
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="app">
  <div class="content">

    <div class="brand-wrap">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path>
        </svg>
      </div>
      <div class="brand-title">Selamat datang kembali</div>
      <div class="brand-sub">Masuk untuk melanjutkan ke akun kamu</div>
    </div>

    <form class="login-card" id="loginForm" novalidate>

      <div class="error-msg" id="errorMsg">Email atau kata sandi salah. Coba lagi.</div>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 6-10 7L2 6"></path>
          </svg>
          <input type="email" id="email" placeholder="nama@email.com" autocomplete="email" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Kata Sandi</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required style="padding-right:42px;">
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan kata sandi">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" id="remember">
          Ingat saya
        </label>
        <button type="button" class="forgot-link" id="forgotBtn">Lupa kata sandi?</button>
      </div>

      <button type="submit" class="btn-login">Masuk</button>

      <div class="divider">atau</div>

      <div class="signup-row">
        Belum punya akun? <a href="#" id="signupLink">Daftar</a>
      </div>

    </form>

  </div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  const togglePass = document.getElementById('togglePass');
  const passwordInput = document.getElementById('password');

  togglePass.addEventListener('click', function() {
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      errorMsg.textContent = 'Mohon isi email dan kata sandi.';
      errorMsg.classList.add('show');
      return;
    }

    // Placeholder proses login — sambungkan ke backend/API di sini
    errorMsg.classList.remove('show');
    alert('Login berhasil (contoh). Sambungkan tombol ini ke sistem autentikasi kamu.');
    // Contoh redirect setelah login sukses:
    // window.location.href = "dashboard.html";
  });

  document.getElementById('forgotBtn').addEventListener('click', function() {
    alert('Arahkan ke halaman lupa kata sandi di sini.');
  });

  document.getElementById('signupLink').addEventListener('click', function(e) {
    e.preventDefault();
    alert('Arahkan ke halaman daftar di sini.');
  });
</script>

</body>
</html>
