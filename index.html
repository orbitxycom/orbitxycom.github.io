<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  :root{
    --bg: #ffffff;
    --surface: #f4f5f7;
    --surface-2: #eceef1;
    --accent: #8b5cf6;
    --accent-dim: rgba(139,92,246,0.12);
    --text: #16181c;
    --text-dim: #8a919a;
    --border: #e4e6e9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  body {
    background: var(--bg);
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  /* Layout kotak-kotak kosong */
  .content {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
  }
  .box-main {
    width: 100%;
    aspect-ratio: 16 / 7;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    margin-bottom: 16px;
  }
  .box-row {
    display: flex;
    gap: 16px;
  }
  .box-half {
    flex: 1;
    aspect-ratio: 1 / 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
  }

  /* Bottom nav bar — liquid glass */
  .navbar {
    position: sticky;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin: 16px;
    padding: 10px;
    border-radius: 28px;
    position: relative;
    overflow: hidden;

    background: linear-gradient(
      165deg,
      rgba(255,255,255,0.95),
      rgba(255,255,255,0.55) 45%,
      rgba(255,255,255,0.75) 100%
    );
    -webkit-backdrop-filter: blur(24px) saturate(200%);
    backdrop-filter: blur(24px) saturate(200%);
    border: 1.5px solid rgba(255,255,255,0.9);
    box-shadow:
      0 20px 40px rgba(16,18,20,0.16),
      0 6px 14px rgba(16,18,20,0.08),
      inset 0 1.5px 0 rgba(255,255,255,1),
      inset 0 -1.5px 6px rgba(16,18,20,0.06),
      inset 2px 0 6px rgba(255,255,255,0.6),
      inset -2px 0 6px rgba(16,18,20,0.04);
  }
  /* Highlight melengkung di bagian atas kaca, seperti pantulan cahaya */
  .navbar::before {
    content: "";
    position: absolute;
    top: 0;
    left: 8%;
    width: 84%;
    height: 40%;
    border-radius: 50% 50% 60% 60% / 100% 100% 30% 30%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.85), rgba(255,255,255,0));
    pointer-events: none;
  }
  /* Bayangan lembut menempel di bawah navbar untuk kesan mengambang */
  .navbar::after {
    content: "";
    position: absolute;
    left: 10%;
    right: 10%;
    bottom: -14px;
    height: 14px;
    background: radial-gradient(ellipse at center, rgba(16,18,20,0.18), transparent 70%);
    filter: blur(4px);
    pointer-events: none;
  }
  .nav-item {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    border-radius: 20px;
    color: rgba(22,24,28,0.45);
    background: transparent;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    border: none;
    position: relative;
    z-index: 1;
  }
  .nav-item:hover {
    color: var(--text);
    background: rgba(16,18,20,0.05);
  }
  .nav-item.active {
    background: rgba(139,92,246,0.16);
    color: var(--accent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
    overflow: hidden;
  }
  .nav-item {
    -webkit-tap-highlight-color: transparent;
  }
  .nav-item:active {
    transform: scale(0.88);
  }
  .nav-item.active:active {
    animation: press-pop 0.35s ease-out;
  }
  @keyframes press-pop {
    0% { transform: scale(0.85); }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  /* Efek ripple hijau saat ditekan */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(139,92,246,0.45);
    transform: scale(0);
    animation: ripple-out 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes ripple-out {
    to {
      transform: scale(3);
      opacity: 0;
    }
  }
  .nav-item svg {
    width: 22px;
    height: 22px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="content">
    <div class="box-main"></div>
    <div class="box-row">
      <div class="box-half"></div>
      <div class="box-half"></div>
    </div>
  </div>

  <nav class="navbar">
    <button class="nav-item active" aria-label="Dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
      </svg>
    </button>
    <button class="nav-item" aria-label="Belajar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10 12 5 2 10l10 5 10-5Z"></path>
        <path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"></path>
      </svg>
    </button>
    <button class="nav-item" aria-label="Chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"></path>
      </svg>
    </button>
    <button class="nav-item" aria-label="Komunitas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    </button>
    <button class="nav-item" aria-label="Dompet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="2"></rect>
        <circle cx="12" cy="12" r="2"></circle>
      </svg>
    </button>
    <button class="nav-item" aria-label="Profil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path>
      </svg>
    </button>
  </nav>
</div>

<script>
  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(item => {
    item.addEventListener('click', function(e) {
      // Pindahkan status aktif (hijau) ke item yang dipencet
      navItems.forEach(i => i.classList.remove('active'));
      this.classList.add('active');

      // Efek ripple hijau menyebar dari titik sentuh
      const rect = this.getBoundingClientRect();
      const ripple = document.createElement('span');
      const size = Math.max(rect.width, rect.height);
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      const x = (e.clientX || rect.left + rect.width / 2) - rect.left - size / 2;
      const y = (e.clientY || rect.top + rect.height / 2) - rect.top - size / 2;
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });
  });
</script>

</body>
</html>
