<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>404 Not Found</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  .container {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Helvetica Neue", Arial, sans-serif;
    text-align: center;
    padding: 0 8%;
    box-sizing: border-box;
  }

  .code {
    font-size: 20vw;
    font-weight: 800;
    color: #4d4d4d;
    line-height: 1;
    margin: 0;
    letter-spacing: 2px;
  }

  .title {
    font-size: 8vw;
    font-weight: 800;
    color: #4d4d4d;
    margin: 4vw 0 3vw 0;
  }

  .message {
    font-size: 3.6vw;
    font-weight: 400;
    color: #4d4d4d;
    margin: 0;
    max-width: 90%;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <div class="title">Not Found</div>
    <div class="message">The resource requested could not be found on this server!</div>
  </div>
</body>
</html>
