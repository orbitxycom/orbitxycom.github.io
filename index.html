<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Earn</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <button class="profile-pill">
      <span class="avatar">
        <svg viewBox="0 0 40 40" width="32" height="32">
          <circle cx="20" cy="20" r="20" fill="#3a2a1a"/>
          <circle cx="20" cy="24" r="10" fill="#e8b48c"/>
          <path d="M8 16 Q12 4 20 6 Q28 4 32 16 Q30 8 20 9 Q10 8 8 16Z" fill="#6ec6d9"/>
          <path d="M14 8 L16 0 L18 9 Z" fill="#4dbb3b"/>
          <path d="M19 6 L21 -1 L23 7 Z" fill="#4dbb3b"/>
          <path d="M24 8 L27 1 L27 10 Z" fill="#4dbb3b"/>
          <rect x="10" y="18" width="20" height="6" rx="2" fill="#222"/>
        </svg>
      </span>
      <span class="username">Safario12</span>
      <span class="chevron">&#8250;</span>
    </button>

    <div class="header-icons">
      <button class="icon-btn wallet-btn" aria-label="wallet">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="6" width="20" height="14" rx="3" fill="#fff"/>
          <rect x="2" y="6" width="20" height="4" rx="2" fill="#e2e2e2"/>
          <circle cx="17" cy="14" r="2" fill="#f5b400"/>
        </svg>
      </button>
      <button class="icon-btn help-btn" aria-label="help">?</button>
      <button class="icon-btn lang-btn" aria-label="language">en</button>
    </div>
  </header>

  <!-- DAILY LIMIT CARD -->
  <section class="limit-card">
    <div class="limit-row">
      <div class="limit-left">
        <span class="limit-label">Daily Limit <span class="chevron small">&#8250;</span></span>
        <div class="limit-value">
          <span class="bolt-icon">
            <svg width="14" height="18" viewBox="0 0 14 18" fill="none"><path d="M8 0L0 10H5.5L4 18L14 6.5H8L8 0Z" fill="#b388ff"/></svg>
          </span>
          <span class="limit-number">734.4K</span>
        </div>
      </div>
      <div class="limit-right">
        <span class="balance-label">Balance</span>
        <div class="balance-value">
          <span class="balance-number">2.13M</span>
          <span class="coin-icon">
            <svg width="22" height="22" viewBox="0 0 22 22">
              <circle cx="11" cy="11" r="11" fill="#f5b400"/>
              <circle cx="11" cy="11" r="8.5" fill="#f7c22e" stroke="#e0a300" stroke-width="0.5"/>
              <path d="M11 4 A7 7 0 0 1 18 11" stroke="#fff2c0" stroke-width="1.4" fill="none" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
      </div>
    </div>

    <!-- LEVEL RING -->
    <div class="level-wrap">
      <svg class="level-ring" width="180" height="180" viewBox="0 0 180 180">
        <circle cx="90" cy="90" r="80" fill="none" stroke="#2a2530" stroke-width="7"/>
        <circle class="ring-progress" cx="90" cy="90" r="80" fill="none" stroke="#a855f7" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="502.4" stroke-dashoffset="376.8" transform="rotate(-90 90 90)"/>
      </svg>
      <div class="level-center">
        <span class="lvl-label">lvl</span>
        <span class="lvl-number">2</span>
      </div>
      <button class="level-progress-btn">2<span class="dim">/3</span> <span class="chevron small">&#8250;</span></button>
    </div>

    <!-- CHARACTERS -->
    <div class="characters">
      <svg class="char cat-char" width="180" height="200" viewBox="0 0 180 200">
        <!-- ears -->
        <polygon points="30,55 15,15 55,45" fill="#4a4a52"/>
        <polygon points="130,55 145,15 105,45" fill="#4a4a52"/>
        <polygon points="33,50 24,25 48,42" fill="#d67fae"/>
        <polygon points="127,50 136,25 112,42" fill="#d67fae"/>
        <!-- head -->
        <rect x="20" y="45" width="120" height="90" rx="35" fill="#54545c"/>
        <!-- headphones over head -->
        <path d="M15 70 Q15 30 80 30 Q145 30 145 70" fill="none" stroke="#2b2b30" stroke-width="10"/>
        <circle cx="15" cy="75" r="12" fill="#2b2b30"/>
        <circle cx="145" cy="75" r="12" fill="#2b2b30"/>
        <!-- pink patch -->
        <path d="M55 45 Q70 20 100 35 Q120 45 105 65 Q90 78 70 65 Q55 58 55 45Z" fill="#e793c4"/>
        <circle cx="65" cy="42" r="4" fill="#c964a8"/>
        <circle cx="85" cy="35" r="3.5" fill="#c964a8"/>
        <circle cx="98" cy="52" r="4" fill="#c964a8"/>
        <!-- eyes -->
        <circle cx="55" cy="95" r="14" fill="#dff5f0"/>
        <circle cx="105" cy="95" r="14" fill="#dff5f0"/>
        <circle cx="55" cy="97" r="8" fill="#2f9e9e"/>
        <circle cx="105" cy="97" r="8" fill="#2f9e9e"/>
        <circle cx="52" cy="94" r="2.5" fill="#fff"/>
        <circle cx="102" cy="94" r="2.5" fill="#fff"/>
        <!-- cheeks -->
        <circle cx="38" cy="112" r="6" fill="#e79ac0" opacity="0.6"/>
        <circle cx="122" cy="112" r="6" fill="#e79ac0" opacity="0.6"/>
        <!-- nose/mouth -->
        <ellipse cx="80" cy="112" rx="4" ry="3" fill="#e79ac0"/>
        <path d="M80 115 Q80 122 72 122 M80 115 Q80 122 88 122" stroke="#3a3a40" stroke-width="2" fill="none"/>
        <!-- whiskers -->
        <line x1="10" y1="105" x2="35" y2="108" stroke="#8a8a92" stroke-width="1.5"/>
        <line x1="10" y1="115" x2="35" y2="115" stroke="#8a8a92" stroke-width="1.5"/>
        <line x1="150" y1="105" x2="125" y2="108" stroke="#8a8a92" stroke-width="1.5"/>
        <line x1="150" y1="115" x2="125" y2="115" stroke="#8a8a92" stroke-width="1.5"/>
        <!-- body -->
        <rect x="35" y="130" width="110" height="60" rx="18" fill="#4a4a52"/>
        <circle cx="90" cy="158" r="12" fill="#e793c4"/>
        <circle cx="90" cy="158" r="6" fill="#c964a8"/>
        <!-- rainbow bit -->
        <path d="M140 130 Q155 130 155 145 Q155 160 140 160" fill="none" stroke="#e04b4b" stroke-width="3"/>
        <path d="M140 137 Q150 137 150 148" fill="none" stroke="#f5b400" stroke-width="3"/>
        <path d="M140 144 Q146 144 146 150" fill="none" stroke="#4dbb3b" stroke-width="3"/>
        <!-- arms/wheels -->
        <circle cx="45" cy="185" r="14" fill="#2b2b30"/>
        <circle cx="45" cy="185" r="6" fill="#e793c4"/>
        <circle cx="135" cy="185" r="14" fill="#2b2b30"/>
        <circle cx="135" cy="185" r="6" fill="#e793c4"/>
      </svg>

      <svg class="char penguin-char" width="150" height="190" viewBox="0 0 150 190">
        <!-- top feather -->
        <path d="M55 10 Q60 -5 68 8 Q72 -8 80 5 Q86 -5 88 10" fill="none" stroke="#9db8d9" stroke-width="5" stroke-linecap="round"/>
        <!-- body -->
        <ellipse cx="75" cy="110" rx="62" ry="72" fill="#aecdf0"/>
        <ellipse cx="75" cy="118" rx="42" ry="58" fill="#ffffff"/>
        <!-- wings -->
        <ellipse cx="24" cy="115" rx="16" ry="38" fill="#8fb4e6"/>
        <ellipse cx="126" cy="115" rx="16" ry="38" fill="#8fb4e6"/>
        <!-- head shading -->
        <path d="M30 60 Q75 25 120 60 Q120 30 75 22 Q30 30 30 60Z" fill="#9dc0ee"/>
        <!-- eyes -->
        <ellipse cx="58" cy="72" rx="9" ry="11" fill="#3a2a1a"/>
        <ellipse cx="94" cy="72" rx="9" ry="11" fill="#3a2a1a"/>
        <circle cx="61" cy="68" r="2.5" fill="#fff"/>
        <circle cx="97" cy="68" r="2.5" fill="#fff"/>
        <!-- beak -->
        <path d="M68 85 Q75 78 82 85 Q80 96 75 96 Q70 96 68 85Z" fill="#f0a63c"/>
        <!-- feet -->
        <ellipse cx="55" cy="185" rx="14" ry="6" fill="#f0a63c"/>
        <ellipse cx="98" cy="185" rx="14" ry="6" fill="#f0a63c"/>
      </svg>
    </div>
  </section>

  <!-- CLAIM BUTTON -->
  <button class="claim-btn">
    <span class="claim-timer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" fill="rgba(0,0,0,0.15)"/>
        <path d="M12 12 L12 7" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M12 12 L15.5 13.5" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="timer-text">7:59:14</span>
    </span>
    <span class="claim-center"><b>255</b> CLAIM</span>
  </button>

  <!-- PIXFI BANNER -->
  <section class="pixfi-banner">
    <div class="banner-pattern"></div>
    <div class="banner-text">
      <div class="banner-title">$PIXFI<br>IS HERE!</div>
      <div class="banner-sub">GET YOUR TOKENS</div>
    </div>
    <button class="banner-claim">CLAIM</button>
  </section>

  <div class="tab-indicator"></div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#a855f7"/><path d="M12 7v10M8.5 9.5c0-1.5 1.5-2 3.5-2s3.5.7 3.5 2c0 3-7 1.5-7 4.5 0 1.3 1.5 2 3.5 2s3.5-.5 3.5-2" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>Earn</span>
    </button>
    <button class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a92" stroke-width="1.6"><path d="M9 12a4 4 0 015.7-3.6l1.6-1.6a4 4 0 015.6 5.6l-2.3 2.3M15 12a4 4 0 01-5.7 3.6l-1.6 1.6a4 4 0 01-5.6-5.6l2.3-2.3"/></svg>
      <span>Invite</span>
    </button>
    <button class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a92" stroke-width="1.6"><path d="M6 3l5 5M18 3l-5 5M8 8L18 18M5 21l3-3M16 8L6 18l-3 3" stroke-linecap="round"/></svg>
      <span>Fight</span>
    </button>
    <button class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a92" stroke-width="1.6"><path d="M3 17l6-6 4 4 8-8M15 7h6v6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Top</span>
    </button>
    <button class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a92" stroke-width="1.6"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z" stroke-linejoin="round"/></svg>
      <span>Rewards</span>
    </button>
  </nav>

</div>
<script src="script.js"></script>
</body>
  </html>
