<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Loading</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .container {
    width: 80%;
    max-width: 400px;
    text-align: center;
  }

  .bar-track {
    position: relative;
    width: 100%;
    height: 5px;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.18);
    background-image: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0.18) 0%,
      rgba(255, 255, 255, 0.55) 50%,
      rgba(255, 255, 255, 0.18) 100%
    );
    background-size: 200% 100%;
    animation: loading 1.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }

  @keyframes loading {
    0%   { background-position: 150% 0; }
    100% { background-position: -50% 0; }
  }

  .label {
    margin-top: 20px;
    color: rgba(255, 255, 255, 0.45);
    font-size: 13px;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="bar-track">
      <div class="bar-fill"></div>
    </div>
    <div class="label">Memuat...</div>
  </div>
</body>
</html>
