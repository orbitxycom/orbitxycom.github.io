<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Safario12</title>
<style>
  :root{
    --bg:#0a0a0d;
    --card:#17151c;
    --card2:#1c1a22;
    --purple:#8b5cf6;
    --purple2:#a855f7;
    --purple-dark:#3b2560;
    --yellow:#ffc518;
    --yellow2:#ffd84d;
    --text:#ffffff;
    --muted:#8b889a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    overflow:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse 120% 60% at 50% 32%, rgba(139,92,246,0.20), transparent 65%),
      var(--bg);
  }
  .app{
    width:100%;
    max-width:520px;
    margin:0 auto;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  .main-content{
    flex:1;
    width:100%;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding:14px 14px 0 14px;
  }

  /* ---------- HEADER ---------- */
  .header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
  }
  .profile-pill{
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
    background:#111212;
    border:1px solid #252626;
    border-radius:24px;
    height:54px;
    padding:0 16px 0 6px;
    min-width:0;
  }
  .avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:linear-gradient(160deg,#ffb454,#ff8a3d);
    flex-shrink:0;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.08);
  }
  .avatar svg{position:absolute;top:2px;left:6px;width:30px;height:39px;}
  .username{
    font-size:17px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chevron{
    color:var(--muted);
    font-size:17px;
    margin-left:auto;
    flex-shrink:0;
  }
  .icon-btn{
    width:44px;
    height:44px;
    border-radius:16px;
    background:#111212;
    border:1px solid #252626;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-size:14px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .icon-btn:active{transform:scale(0.90);background:#201d26;}
  .icon-btn.lang{width:44px;height:44px;padding:0;border-radius:16px;}

  /* ---------- DAILY LIMIT CARD ---------- */
  .daily-card{
    background:linear-gradient(180deg,#18151d,#141218);
    border:1px solid #24202b;
    border-radius:26px;
    padding:16px 18px;
    margin-bottom:18px;
  }
  .daily-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .daily-label{
    display:flex;
    align-items:center;
    gap:4px;
    color:#b9b6c2;
    font-size:14px;
    font-weight:500;
  }
  .daily-label .chev{font-size:13px;color:#7a7784;}
  .balance-label{
    color:#b9b6c2;
    font-size:14px;
    font-weight:500;
  }
  .daily-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
  }
  .daily-value, .balance-value{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:22px;
    font-weight:700;
  }
  .balance-value{color:var(--yellow);}
  .lightning-badge{
    width:26px;
    height:26px;
    border-radius:8px;
    background:#241a35;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .coin-badge{
    width:24px;
    height:24px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffe27a, #ffb400);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  /* ---------- LEVEL RING ---------- */
  .level-wrap{
    display:flex;
    justify-content:center;
    margin:6px 0 6px 0;
    position:relative;
  }
  .ring-box{
    width:200px;
    height:200px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring-box svg{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    transform:rotate(-90deg);
    filter:drop-shadow(0 0 10px rgba(168,85,247,0.45));
  }
  .ring-center{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:2;
  }
  .lvl-label{
    font-size:15px;
    color:#c9c6d3;
    font-weight:500;
    letter-spacing:0.5px;
  }
  .lvl-number{
    font-size:44px;
    font-weight:800;
    line-height:1;
    margin-top:2px;
  }
  .lvl-pill{
    position:absolute;
    bottom:-6px;
    background:linear-gradient(180deg,#9d5cf5,#7c3aed);
    padding:6px 16px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:4px;
    box-shadow:0 4px 14px rgba(124,58,237,0.5);
    cursor:pointer;
    user-select:none;
  }
  .lvl-pill .fade{color:rgba(255,255,255,0.55);}

  /* ---------- CHARACTERS ---------- */
  .characters{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:2px;
    margin:8px 0 14px 0;
    min-height:190px;
  }
  .characters svg{
    filter:drop-shadow(0 12px 18px rgba(0,0,0,0.55));
  }
  .cat-char{width:150px;height:180px;}
  .penguin-char{width:130px;height:180px;margin-left:-14px;}

  /* ---------- CLAIM BUTTON ---------- */
  .claim-btn{
    width:100%;
    background:linear-gradient(180deg,var(--yellow2),var(--yellow));
    border-radius:30px;
    padding:8px;
    display:flex;
    align-items:center;
    gap:10px;
    border:none;
    cursor:pointer;
    margin-bottom:14px;
    box-shadow:0 8px 20px rgba(255,197,24,0.25);
    transition:transform .12s ease;
  }
  .claim-btn:active{transform:scale(0.97);}
  .timer-circle{
    width:56px;
    height:56px;
    border-radius:50%;
    background:rgba(0,0,0,0.18);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .timer-circle svg{width:16px;height:16px;margin-bottom:1px;}
  .timer-text{
    font-size:11px;
    font-weight:700;
    color:#3a2c00;
  }
  .claim-text{
    flex:1;
    text-align:center;
    font-size:21px;
    font-weight:800;
    color:#1a1200;
    padding-right:56px;
  }
  .claim-text span{
    font-weight:700;
    color:#5c4a12;
    opacity:0.75;
    margin-left:6px;
  }

  /* ---------- BANNER ---------- */
  .banner{
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,#8b3fe0,#7c3aed 60%,#a855f7);
    border-radius:24px;
    padding:20px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:112px;
  }
  .banner .bg-pattern{
    position:absolute;
    inset:0;
    opacity:0.18;
    background-image:
      linear-gradient(45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%),
      linear-gradient(-45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%);
    background-size:34px 34px;
  }
  .banner-text{position:relative;z-index:2;}
  .banner-text .l1{
    font-size:21px;
    font-weight:800;
    line-height:1.15;
  }
  .banner-text .l2{
    font-size:21px;
    font-weight:800;
    line-height:1.15;
  }
  .banner-text .l3{
    font-size:12.5px;
    font-weight:600;
    color:rgba(255,255,255,0.85);
    margin-top:8px;
    letter-spacing:0.3px;
  }
  .banner-claim{
    position:relative;
    z-index:2;
    background:linear-gradient(180deg,var(--yellow2),var(--yellow));
    color:#1a1200;
    font-size:14px;
    font-weight:800;
    border:none;
    padding:12px 22px;
    border-radius:18px;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .12s ease;
  }
  .banner-claim:active{transform:scale(0.93);}

  /* ---------- BOTTOM NAV ---------- */
  .content-bottom-space{height:96px;}
  .bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    width:100%;
    max-width:520px;
    margin:0 auto;
    background:#0c0b0f;
    border-top:1px solid #201e26;
    display:flex;
    padding:10px 4px calc(10px + env(safe-area-inset-bottom,0px)) 4px;
    z-index:50;
  }
  .nav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:var(--muted);
    cursor:pointer;
    font-size:11px;
    font-weight:600;
    padding:4px 0;
    transition:color .15s ease;
    -webkit-user-select:none;
    user-select:none;
  }
  .nav-item svg{width:22px;height:22px;transition:transform .15s ease;}
  .nav-item.active{color:var(--purple2);}
  .nav-item.active svg{transform:translateY(-1px);}
  .nav-item:active svg{transform:scale(0.85);}
  .nav-indicator{
    position:absolute;
    top:0;
    height:2px;
    background:var(--purple2);
    border-radius:2px;
    transition:left .25s ease, width .25s ease;
  }
  .bottom-nav{position:fixed;}
</style>
</head>
<body>
<div class="app">
<div class="main-content">

  <!-- HEADER -->
  <div class="header">
    <div class="profile-pill">
      <div class="avatar">

  <!-- CLAIM BUTTON -->
  <button class="claim-btn" id="claimBtn">

      <span>Rewards</span>

</div>

<script>
  // countdown timer
  (function(){
    var totalSeconds = 7*3600 + 59*60 + 14;
    var el = document.getElementById('timerText');
    function fmt(s){
      var h = Math.floor(s/3600);
      var m = Math.floor((s%3600)/60);
      var sec = s%60;
      return h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    }
    setInterval(function(){
      if(totalSeconds > 0){
        totalSeconds--;
        el.textContent = fmt(totalSeconds);
      } else {
        totalSeconds = 8*3600;
      }
    }, 1000);
  })();

  // bottom nav active state + moving purple indicator
  var navIndicator = document.getElementById('navIndicator');
  var navItems = document.querySelectorAll('.nav-item');

  function moveIndicatorTo(item){
    var navRect = item.parentElement.getBoundingClientRect();
    var itemRect = item.getBoundingClientRect();
    var width = 28;
    var left = (itemRect.left - navRect.left) + (itemRect.width / 2) - (width / 2);
    navIndicator.style.width = width + 'px';
    navIndicator.style.left = left + 'px';
  }

  navItems.forEach(function(item){
    item.addEventListener('click', function(){
      navItems.forEach(function(i){ i.classList.remove('active'); });
      item.classList.add('active');
      moveIndicatorTo(item);
    });
  });

  // set initial indicator position on load
  window.addEventListener('load', function(){
    var activeItem = document.querySelector('.nav-item.active');
    if(activeItem){
      navIndicator.style.transition = 'none';
      moveIndicatorTo(activeItem);
      requestAnimationFrame(function(){
        navIndicator.style.transition = 'left .25s ease, width .25s ease';
      });
    }
  });

  // claim button feedback
  document.getElementById('claimBtn').addEventListener('click', function(){
    this.style.transform = 'scale(0.95)';
    var self = this;
    setTimeout(function(){ self.style.transform=''; }, 120);
  });

  document.getElementById('pixfiClaimBtn').addEventListener('click', function(e){
    e.stopPropagation();
    this.textContent = 'CLAIMED';
    var self = this;
    setTimeout(function(){ self.textContent = 'CLAIM'; }, 1500);
  });

  // icon buttons feedback (wallet/help/lang)
  document.querySelectorAll('.icon-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      btn.style.opacity = '0.6';
      setTimeout(function(){ btn.style.opacity = '1'; }, 150);
    });
  });

  // level pill
  document.getElementById('lvlPill').addEventListener('click', function(){
    this.style.transform = 'scale(0.93)';
    var self = this;
    setTimeout(function(){ self.style.transform=''; }, 120);
  });
</script>
</body>
</html>
