<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#F3F4F6;
    --card-bg:#FFFFFF;
    --border:#E5E7EB;
    --ink:#1F2937;
    --ink-soft:#6B7280;
    --blue:#3B82F6;
    --blue-dark:#2563EB;
    --amber:#D97706;
    --amber-bg:#FEF3C7;
    --red:#DC2626;
    --red-bg:#FEE2E2;
    --green:#16A34A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .page{width:100%;max-width:420px;}
  .card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:0;
    padding:28px 24px 24px;
    text-align:center;
  }

  /* Merchant header — placeholder, edit merchantName in the script below */
  .merchant{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
  }
  .avatar{
    width:52px;height:52px;
    border-radius:0;
    background:var(--page-bg);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
  }
  .merchant-name{
    font-weight:600;
    font-size:15px;
    color:var(--ink-soft);
  }

  /* QR */
  .qr-frame{
    background:#fff;
    border:1px solid var(--border);
    border-radius:0;
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:18px;
  }
  #qrCanvas{line-height:0;}
  #qrCanvas img, #qrCanvas canvas{display:block;}

  .instruction{
    font-size:14.5px;
    color:var(--ink);
    line-height:1.5;
    margin:0 0 18px;
  }

  .timer-row{
    font-size:14px;
    color:var(--ink);
    margin-bottom:20px;
  }
  .timer-value{
    display:inline-block;
    background:var(--red-bg);
    color:var(--red);
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:14px;
    padding:3px 10px;
    border-radius:0;
    margin-left:4px;
  }

  /* Invoice table — all values start empty/placeholder */
  .invoice-table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:22px;
    text-align:left;
  }
  .invoice-table td{
    padding:12px 14px;
    border:1px solid var(--border);
    font-size:14.5px;
    vertical-align:top;
  }
  .invoice-table td:first-child{
    width:40%;
    color:var(--ink);
  }
  .invoice-table td:last-child{
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
  }
  .status-badge{
    display:inline-block;
    background:var(--amber-bg);
    color:var(--amber);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:3px 10px;
    border-radius:0;
  }
  .status-badge.paid{background:#DCFCE7;color:var(--green);}

  .paid-btn{
    width:100%;
    padding:14px 16px;
    border:none;
    border-radius:0;
    background:var(--blue);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .paid-btn:hover{background:var(--blue-dark);}
  .paid-btn:disabled{opacity:0.7;cursor:not-allowed;}

  .hourglass-icon{
    display:inline-block;
    animation:hourglass-wobble 1.6s ease-in-out infinite;
    transform-origin:50% 85%;
  }
  @keyframes hourglass-wobble{
    0%, 100%{transform:rotate(0deg);}
    25%{transform:rotate(-12deg);}
    75%{transform:rotate(12deg);}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
    .hourglass-icon{animation:none;}
  }
</style>
</head>
<body>
<div class="page">
  <div class="card">

    <div class="qr-frame"><div id="qrCanvas"></div></div>

    <p class="instruction">Scan QR code ini menggunakan e-wallet atau mobile banking Anda</p>

    <div class="timer-row"><span class="hourglass-icon">⏳</span> Sisa waktu:<span class="timer-value" id="timerValue">--:--</span></div>

    <table class="invoice-table">
      <tr><td>Invoice ID</td><td id="invId">-</td></tr>
      <tr><td>Status</td><td><span class="status-badge" id="invStatus">🕐 Menunggu Pembayaran</span></td></tr>
      <tr><td>Nominal</td><td id="invNominal">-</td></tr>
      <tr><td>Fee</td><td id="invFee">-</td></tr>
      <tr><td>Total</td><td id="invTotal">-</td></tr>
      <tr><td>Tanggal</td><td id="invDate">-</td></tr>
    </table>

    <button type="button" class="paid-btn" id="paidBtn">Saya Sudah Bayar</button>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){

  /* ------------------------------------------------------------
     DATA INVOICE — masih kosong, isi di sini kalau sudah ada data
     ------------------------------------------------------------ */
  const invoice = {
    id: '',                  // Invoice ID
    status: 'pending',       // 'pending' | 'paid'
    nominal: '',             // contoh: 10000
    fee: '',                 // contoh: 169
    total: '',                // contoh: 10169
    date: '',                // contoh: '14 Agu 2026, 21:39'
    qrContent: '',           // string/payload yang akan di-encode ke QR
    expiresInSeconds: null   // contoh: 1800 (30 menit). null = timer tidak jalan dulu
  };
  /* ------------------------------------------------------------ */

  const fmtRp = v => v === '' || v === null || v === undefined ? '-' : 'Rp ' + Number(v).toLocaleString('id-ID');

  document.getElementById('invId').textContent = invoice.id || '-';
  document.getElementById('invNominal').textContent = fmtRp(invoice.nominal);
  document.getElementById('invFee').textContent = fmtRp(invoice.fee);
  document.getElementById('invTotal').textContent = fmtRp(invoice.total);
  document.getElementById('invDate').textContent = invoice.date || '-';

  const statusEl = document.getElementById('invStatus');
  if(invoice.status === 'paid'){
    statusEl.textContent = '✓ Sudah Dibayar';
    statusEl.classList.add('paid');
  } else {
    statusEl.textContent = '🕐 Menunggu Pembayaran';
  }

  // QR — render kalau ada isinya, kalau kosong tampilkan placeholder kotak
  const qrEl = document.getElementById('qrCanvas');
  function renderQr(text){
    qrEl.innerHTML = '';
    try{
      if(typeof QRCode === 'function' && text){
        new QRCode(qrEl, { text: text, width: 180, height: 180, colorDark:'#1F2937', colorLight:'#ffffff' });
      } else {
        qrEl.innerHTML = '<div style="width:180px;height:180px;border:1.5px dashed #D1D5DB;border-radius:0;display:flex;align-items:center;justify-content:center;text-align:center;font-family:IBM Plex Mono,monospace;font-size:11px;color:#9CA3AF;padding:10px;">Menunggu data QR</div>';
      }
    } catch(err){
      qrEl.innerHTML = '<div style="width:180px;height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:IBM Plex Mono,monospace;font-size:11px;color:#9CA3AF;padding:10px;">QR tidak dapat dimuat</div>';
    }
  }
  renderQr(invoice.qrContent);

  // Timer — hanya jalan kalau expiresInSeconds diisi
  const timerEl = document.getElementById('timerValue');
  if(invoice.expiresInSeconds){
    let seconds = invoice.expiresInSeconds;
    const tick = ()=>{
      const h = Math.floor(seconds/3600).toString().padStart(2,'0');
      const m = Math.floor((seconds%3600)/60).toString().padStart(2,'0');
      const s = Math.floor(seconds%60).toString().padStart(2,'0');
      timerEl.textContent = (invoice.expiresInSeconds >= 3600 ? h+':' : '') + m + ':' + s;
      if(seconds <= 0){
        clearInterval(interval);
        timerEl.textContent = 'Kadaluarsa';
      }
      seconds--;
    };
    tick();
    const interval = setInterval(tick, 1000);
  }

  // Tombol "Saya Sudah Bayar" — simulasi cek status, sambungkan ke API kalau sudah ada
  document.getElementById('paidBtn').addEventListener('click', function(){
    const btn = this;
    btn.disabled = true;
    btn.textContent = 'Memeriksa…';
    setTimeout(()=>{
      btn.disabled = false;
      btn.textContent = 'Saya Sudah Bayar';
      alert('Belum ada data status pembayaran untuk dicek.');
    }, 900);
  });

});
</script>
</body>
</html>
