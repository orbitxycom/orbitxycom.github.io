<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Header Buttons</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #121212;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
  }
  .logo {
    color: #ffffff;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-left: 8px;
  }
  .btn-masuk {
    background: #2c2c2e;
    color: #ffffff;
  }
  .btn-masuk:hover {
    background: #3a3a3c;
  }
  .btn-daftar {
    background: #23c65b;
    color: #ffffff;
  }
  .btn-daftar:hover {
    background: #1fae4f;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">orbitxy</div>
    <div>
      <button class="btn btn-masuk">Masuk</button>
      <button class="btn btn-daftar">Pendaftaran</button>
    </div>
  </div>
</body>
</html>
