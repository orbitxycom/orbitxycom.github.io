<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header orbitxy</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #121212;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #161616;
    padding: clamp(14px, 3.5vw, 20px) clamp(16px, 4vw, 28px);
  }
  .logo {
    color: #ffffff;
    font-size: clamp(18px, 4.5vw, 24px);
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .buttons {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2vw, 14px);
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: clamp(9px, 2.2vw, 13px) clamp(18px, 4.5vw, 28px);
    font-size: clamp(14px, 3.2vw, 16px);
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-masuk {
    background: #2c2c2e;
    color: #ffffff;
  }
  .btn-masuk:hover {
    background: #3a3a3c;
  }
  .btn-daftar {
    background: #23c65b;
    color: #ffffff;
  }
  .btn-daftar:hover {
    background: #1fae4f;
  }

  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: #161616;
    border-top: 1px solid #2a2a2a;
    padding: clamp(8px, 2vw, 12px) 4px calc(clamp(8px, 2vw, 12px) + env(safe-area-inset-bottom));
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: none;
    border: none;
    color: #9a9a9a;
    font-size: clamp(10px, 2.6vw, 12px);
    cursor: pointer;
    flex: 1;
  }
  .nav-item svg {
    width: clamp(20px, 5.5vw, 26px);
    height: clamp(20px, 5.5vw, 26px);
  }
  .nav-item.active {
    color: #2f7bff;
  }

  /* ---- Drawer Menu ---- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 40;
  }
  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(80vw, 320px);
    background: #1c1c1e;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 50;
    overflow-y: auto;
    padding: 20px 0;
  }
  .drawer.show {
    transform: translateX(0);
  }
  .drawer-top {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 18px 18px;
    cursor: pointer;
  }
  .drawer-close {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 60;
    background: rgba(255,255,255,0.12);
    border-radius: 50%;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .drawer-close.show {
    opacity: 1;
    pointer-events: auto;
  }
  .drawer-user {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #3a3a3c;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cfcfcf;
  }
  .avatar svg { width: 22px; height: 22px; }
  .drawer-user span {
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
  }
  .drawer-close, .drawer-arrow {
    background: none;
    border: none;
    color: #9a9a9a;
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  .drawer-close svg { width: 18px; height: 18px; }
  .drawer-arrow svg { width: 20px; height: 20px; }
  .drawer-divider {
    height: 1px;
    background: #2c2c2e;
    margin: 8px 0;
  }
  .drawer-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    color: #f0f0f0;
    font-size: 16px;
    cursor: pointer;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
  }
  .drawer-item:hover {
    background: #26262a;
  }
  .drawer-item.active-item {
    background: #2c2c30;
    border-radius: 10px;
    margin: 0 8px;
    width: calc(100% - 16px);
  }
  .drawer-item-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .drawer-item-left svg {
    width: 22px;
    height: 22px;
    color: #cfcfcf;
  }
  .drawer-item svg.chevron {
    width: 18px;
    height: 18px;
    color: #8a8a8e;
  }

  /* ---- Login Modal ---- */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 70;
  }
  .login-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .login-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    background: #161616;
    border-radius: 20px 20px 0 0;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    z-index: 80;
    padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
    max-height: 90vh;
    overflow-y: auto;
  }
  .login-sheet.show {
    transform: translateY(0);
  }
  .login-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .login-header h2 {
    color: #ffffff;
    font-size: clamp(22px, 6vw, 28px);
    margin: 0;
    font-weight: 800;
  }
  .login-close {
    background: none;
    border: none;
    color: #9a9a9a;
    cursor: pointer;
    display: flex;
  }
  .login-close svg { width: 24px; height: 24px; }

  .login-field {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #232325;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
    border: 1.5px solid transparent;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .login-field:focus-within {
    border-color: #2f7bff;
    background: #1e1e20;
  }
  .field-inner {
    position: relative;
    flex: 1;
    min-width: 0;
  }
  .field-inner label {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    color: #8a8a8e;
    font-size: 15px;
    pointer-events: none;
    transition: all 0.15s ease;
    transform-origin: left center;
  }
  .field-inner input {
    background: none;
    border: none;
    outline: none;
    color: #ffffff;
    font-size: 15px;
    width: 100%;
    padding-top: 8px;
  }
  .field-inner input:focus ~ label,
  .field-inner input:not(:placeholder-shown) ~ label {
    top: 2px;
    transform: translateY(0) scale(0.78);
    color: #2f7bff;
  }
  .login-field svg {
    width: 20px;
    height: 20px;
    color: #9a9a9a;
    flex-shrink: 0;
  }

  .forgot-pass {
    text-align: right;
    margin-bottom: 18px;
  }
  .forgot-pass a {
    color: #2f7bff;
    font-size: 14px;
    text-decoration: none;
    font-weight: 600;
  }

  .btn-login-submit {
    width: 100%;
    background: #23c65b;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 22px;
  }
  .btn-login-submit:hover {
    background: #1fae4f;
  }

  .or-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #8a8a8e;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .or-divider::before,
  .or-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #2c2c2e;
  }

  .social-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .social-btn {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #232325;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #ffffff;
  }
  .social-btn svg { width: 22px; height: 22px; }

  .signup-line {
    text-align: center;
    color: #b0b0b0;
    font-size: 14px;
  }
  .signup-line a {
    color: #2f7bff;
    font-weight: 700;
    text-decoration: none;
    display: block;
    margin-top: 4px;
  }

  .field-hint {
    color: #9a9a9a;
    font-size: 13px;
    margin: -8px 0 16px 4px;
  }
  .promo-link {
    margin-bottom: 20px;
  }
  .promo-link a {
    color: #2f7bff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
  }
  .terms-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 22px;
  }
  .terms-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-top: 2px;
    accent-color: #23c65b;
    flex-shrink: 0;
  }
  .terms-row label {
    color: #d0d0d0;
    font-size: 14px;
    line-height: 1.4;
  }
  .terms-row a {
    color: #2f7bff;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    const drawerClose = document.getElementById('drawerClose');

    function openDrawer() {
      drawer.classList.add('show');
      overlay.classList.add('show');
      drawerClose.classList.add('show');
    }
    function closeDrawer() {
      drawer.classList.remove('show');
      overlay.classList.remove('show');
      drawerClose.classList.remove('show');
    }

    menuBtn.addEventListener('click', openDrawer);
    drawerClose.addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);

    const masukBtn = document.getElementById('masukBtn');
    const loginSheet = document.getElementById('loginSheet');
    const loginOverlay = document.getElementById('loginOverlay');
    const loginClose = document.getElementById('loginClose');

    function openLogin() {
      loginSheet.classList.add('show');
      loginOverlay.classList.add('show');
    }
    function closeLogin() {
      loginSheet.classList.remove('show');
      loginOverlay.classList.remove('show');
    }

    masukBtn.addEventListener('click', openLogin);
    loginClose.addEventListener('click', closeLogin);
    loginOverlay.addEventListener('click', closeLogin);

    const daftarBtn = document.getElementById('daftarBtn');
    const registerSheet = document.getElementById('registerSheet');
    const registerOverlay = document.getElementById('registerOverlay');
    const registerClose = document.getElementById('registerClose');

    function openRegister() {
      registerSheet.classList.add('show');
      registerOverlay.classList.add('show');
    }
    function closeRegister() {
      registerSheet.classList.remove('show');
      registerOverlay.classList.remove('show');
    }

    daftarBtn.addEventListener('click', openRegister);
    registerClose.addEventListener('click', closeRegister);
    registerOverlay.addEventListener('click', closeRegister);
