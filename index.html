<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header orbitxy</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #121212;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #161616;
    padding: clamp(14px, 3.5vw, 20px) clamp(16px, 4vw, 28px);
  }
  .logo {
    color: #ffffff;
    font-size: clamp(18px, 4.5vw, 24px);
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .buttons {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2vw, 14px);
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: clamp(9px, 2.2vw, 13px) clamp(18px, 4.5vw, 28px);
    font-size: clamp(14px, 3.2vw, 16px);
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-masuk {
    background: #2c2c2e;
    color: #ffffff;
  }
  .btn-masuk:hover {
    background: #3a3a3c;
  }
  .btn-daftar {
    background: #23c65b;
    color: #ffffff;
  }
  .btn-daftar:hover {
    background: #1fae4f;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">orbitxy</div>
    <div class="buttons">
      <button class="btn btn-masuk">Masuk</button>
      <button class="btn btn-daftar">Pendaftaran</button>
    </div>
  </div>
</body>
</html>
