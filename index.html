<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header orbitxy</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #121212;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #161616;
    padding: clamp(14px, 3.5vw, 20px) clamp(16px, 4vw, 28px);
  }
  .logo {
    color: #ffffff;
    font-size: clamp(18px, 4.5vw, 24px);
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .buttons {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2vw, 14px);
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: clamp(9px, 2.2vw, 13px) clamp(18px, 4.5vw, 28px);
    font-size: clamp(14px, 3.2vw, 16px);
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-masuk {
    background: #2c2c2e;
    color: #ffffff;
  }
  .btn-masuk:hover {
    background: #3a3a3c;
  }
  .btn-daftar {
    background: #23c65b;
    color: #ffffff;
  }
  .btn-daftar:hover {
    background: #1fae4f;
  }

  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: #161616;
    border-top: 1px solid #2a2a2a;
    padding: clamp(8px, 2vw, 12px) 4px calc(clamp(8px, 2vw, 12px) + env(safe-area-inset-bottom));
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: none;
    border: none;
    color: #9a9a9a;
    font-size: clamp(10px, 2.6vw, 12px);
    cursor: pointer;
    flex: 1;
  }
  .nav-item svg {
    width: clamp(20px, 5.5vw, 26px);
    height: clamp(20px, 5.5vw, 26px);
  }
  .nav-item.active {
    color: #2f7bff;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">orbitxy</div>
    <div class="buttons">
      <button class="btn btn-masuk">Masuk</button>
      <button class="btn btn-daftar">Pendaftaran</button>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <span>Menu</span>
    </button>
    <button class="nav-item active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>
      <span>Beranda</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><line x1="12" y1="4" x2="12" y2="6.5"/><line x1="12" y1="17.5" x2="12" y2="20"/><line x1="4" y1="12" x2="6.5" y2="12"/><line x1="17.5" y1="12" x2="20" y2="12"/><line x1="6.5" y1="6.5" x2="8.2" y2="8.2"/><line x1="15.8" y1="15.8" x2="17.5" y2="17.5"/><line x1="6.5" y1="17.5" x2="8.2" y2="15.8"/><line x1="15.8" y1="8.2" x2="17.5" y2="6.5"/></svg>
      <span>Kasino</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 15.2c.4.9 1.3 1.4 2.5 1.4 1.6 0 2.7-.8 2.7-2 0-1.3-1.1-1.8-2.7-2.2-1.6-.4-2.6-.9-2.6-2.1 0-1.1 1-1.9 2.5-1.9 1.1 0 2 .4 2.4 1.2" stroke-linecap="round"/><line x1="12" y1="6.5" x2="12" y2="17.8"/></svg>
      <span>Free money</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><polygon points="12,8 14.3,9.7 13.4,12.4 10.6,12.4 9.7,9.7" fill="currentColor" stroke="none"/><line x1="12" y1="3" x2="12" y2="8"/><line x1="14.3" y1="9.7" x2="19" y2="8.3"/><line x1="13.4" y1="12.4" x2="15.5" y2="18"/><line x1="10.6" y1="12.4" x2="8.5" y2="18"/><line x1="9.7" y1="9.7" x2="5" y2="8.3"/></svg>
      <span>Olahraga</span>
    </button>
  </div>
</body>
</html>
