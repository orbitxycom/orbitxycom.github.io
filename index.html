<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Explore the app</title>
<link rel="icon" type="image/png" href="https://orbitxy.com/orbitxy.com.png">
<link rel="apple-touch-icon" href="https://orbitxy.com/orbitxy.com.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
<style>
  :root {
    --bg: #000000;
    --ink: #ffffff;
    --muted: #a0a0a0;
    --rose: #1a1420;
    --rose-line: #a78bfa;
    --border: #2a2a2a;
    --primary: #ffffff;
    --primary-text: #0a0a0a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100dvh;
  }

  .screen {
    position: relative;
    width: 100%;
    max-width: 430px;
    min-height: 100dvh;
    margin: 0 auto;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 0 28px;
  }

  .rays {
    position: absolute;
    top: -10%;
    left: 50%;
    width: 900px;
    height: 900px;
    transform: translateX(-50%);
    background: repeating-conic-gradient(
      from 0deg,
      rgba(255,255,255,0.035) 0deg 1.2deg,
      transparent 1.2deg 6deg
    );
    -webkit-mask-image: radial-gradient(circle at center, black 0%, black 40%, transparent 72%);
    mask-image: radial-gradient(circle at center, black 0%, black 40%, transparent 72%);
    pointer-events: none;
  }

  .lottie-wrap {
    position: relative;
    margin: 10vh auto 0;
    width: 260px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .content {
    position: relative;
    text-align: center;
    margin-top: 28px;
  }

  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 28px;
    color: var(--ink);
    margin: 0 0 12px;
  }

  .subtitle {
    font-size: 15px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 280px;
    margin: 0 auto;
  }

  .actions {
    position: relative;
    margin-top: auto;
    padding-bottom: calc(32px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn-primary, .btn-secondary {
    width: 100%;
    height: 54px;
    border-radius: 16px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .btn-primary:active, .btn-secondary:active { transform: scale(0.98); }

  .btn-primary {
    background: var(--primary);
    color: var(--primary-text);
  }

  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--border);
  }

  .btn-primary:focus-visible, .btn-secondary:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="rays"></div>

    <div class="lottie-wrap">
      <dotlottie-wc src="https://lottie.host/fee0ee8a-8f09-4d8b-981e-50f6edcc1c2b/fPkxTExMAm.json" style="width: 260px; height: 260px" autoplay loop></dotlottie-wc>
    </div>

    <div class="content">
      <h1>Explore the app</h1>
      <p class="subtitle">Your trusted marketplace for buying and selling accounts.</p>
    </div>

    <div class="actions">
      <a class="btn-primary" href="/login/">Sign in</a>
      <a class="btn-secondary" href="/create-account/">Create account</a>
    </div>
  </div>
</body>
</html>
