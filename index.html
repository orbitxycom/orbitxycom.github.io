<!doctype html>
<html lang="id" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="logo">
        <a class="sb-btn logo-icon" data-tip="Chatbot" href="#"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></a>
        <button class="sb-btn logo-toggle" id="openBtn" data-tip="Open sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
      </div>
      <button class="sb-btn trigger" id="closeBtn" title="Close sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
    </div>
    <nav class="sb-menu">
      <button class="sb-item new-chat" id="newChat" data-tip="New Chat"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>New chat</span></button>
      <button class="sb-item del" id="delAll" data-tip="Delete All Chats"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg><span>Delete all</span></button>
    </nav>
    <div class="hist" id="hist">
      <div class="hist-label">History</div>
      <div class="hist-empty" id="histEmpty">Your conversations will appear here once you start chatting!</div>
    </div>
    <div class="sb-foot"><button class="sb-item" id="theme" data-tip="Ganti tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Ganti tema</span></button></div>
  </aside>
  <div class="main">
    <header>
      <button class="icon-btn mob" id="mobBtn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
      <div class="vis" id="vis">
        <button class="chip" id="visBtn"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span id="visLabel">Private</span><svg viewBox="0 0 24 24" style="font-size:12px"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="menu" id="visMenu">
          <button data-v="Private"><b>Private</b><small>Only you can access this chat</small></button>
          <button data-v="Public"><b>Public</b><small>Anyone with the link can access</small></button>
        </div>
      </div>
    </header>
    <div class="chat" id="chat"><div class="chat-inner" id="inner"></div></div>
    <div class="composer-wrap">
      <div class="sugs-wrap" id="sugsWrap"></div>
      <div class="composer">
        <textarea id="input" placeholder="Ask anything..." rows="1"></textarea>
        <div class="c-foot">
          <span class="model">Demo model</span>
          <button class="send" id="send" disabled><svg viewBox="0 0 24 24" style="font-size:16px"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="dialog-bg" id="dlg"><div class="dialog"><h3>Delete all chats?</h3><p>This action cannot be undone. This will permanently delete all your chats and remove them from our servers.</p><div class="dlg-btns"><button id="dlgNo">Cancel</button><button id="dlgYes" class="primary">Delete All</button></div></div></div>
<script src="script.js"></script>
</body>
</html>
