<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header orbitxy</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, input, a {
    outline: none;
  }
  button:focus, input:focus, a:focus {
    outline: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #121212;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #161616;
    padding: clamp(14px, 3.5vw, 20px) clamp(16px, 4vw, 28px);
  }
  .logo {
    color: #ffffff;
    font-size: clamp(18px, 4.5vw, 24px);
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .buttons {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2vw, 14px);
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: clamp(9px, 2.2vw, 13px) clamp(18px, 4.5vw, 28px);
    font-size: clamp(14px, 3.2vw, 16px);
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-masuk {
    background: #2c2c2e;
    color: #ffffff;
  }
  .btn-masuk:hover {
    background: #3a3a3c;
  }
  .btn-daftar {
    background: #23c65b;
    color: #ffffff;
  }
  .btn-daftar:hover {
    background: #1fae4f;
  }

  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: #161616;
    border-top: 1px solid #2a2a2a;
    padding: clamp(8px, 2vw, 12px) 4px calc(clamp(8px, 2vw, 12px) + env(safe-area-inset-bottom));
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: none;
    border: none;
    color: #9a9a9a;
    font-size: clamp(10px, 2.6vw, 12px);
    cursor: pointer;
    flex: 1;
  }
  .nav-item svg {
    width: clamp(20px, 5.5vw, 26px);
    height: clamp(20px, 5.5vw, 26px);
  }
  .nav-item.active {
    color: #2f7bff;
  }

  /* ---- Drawer Menu ---- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 40;
  }
  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(80vw, 320px);
    background: #1c1c1e;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 50;
    overflow-y: auto;
    padding: 20px 0;
  }
  .drawer.show {
    transform: translateX(0);
  }
  .drawer-top {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 18px 18px;
    cursor: pointer;
  }
  .drawer-close {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 60;
    background: rgba(255,255,255,0.12);
    border-radius: 50%;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .drawer-close.show {
    opacity: 1;
    pointer-events: auto;
  }
  .drawer-user {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #3a3a3c;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cfcfcf;
  }
  .avatar svg { width: 22px; height: 22px; }
  .drawer-user span {
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
  }
  .drawer-close, .drawer-arrow {
    background: none;
    border: none;
    color: #9a9a9a;
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  .drawer-close svg { width: 18px; height: 18px; }
  .drawer-arrow svg { width: 20px; height: 20px; }
  .drawer-divider {
    height: 1px;
    background: #2c2c2e;
    margin: 8px 0;
  }
  .drawer-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    color: #f0f0f0;
    font-size: 16px;
    cursor: pointer;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
  }
  .drawer-item:hover {
    background: #26262a;
  }
  .drawer-item.active-item {
    background: #2c2c30;
    border-radius: 10px;
    margin: 0 8px;
    width: calc(100% - 16px);
  }
  .drawer-item-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .drawer-item-left svg {
    width: 22px;
    height: 22px;
    color: #cfcfcf;
  }
  .drawer-item svg.chevron {
    width: 18px;
    height: 18px;
    color: #8a8a8e;
  }

  /* ---- Login Modal ---- */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 70;
  }
  .login-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .login-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    background: #161616;
    border-radius: 20px 20px 0 0;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    z-index: 80;
    padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
    max-height: 90vh;
    overflow-y: auto;
  }
  .login-sheet.show {
    transform: translateY(0);
  }
  .login-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .login-header h2 {
    color: #ffffff;
    font-size: clamp(22px, 6vw, 28px);
    margin: 0;
    font-weight: 800;
  }
  .login-close {
    background: none;
    border: none;
    color: #9a9a9a;
    cursor: pointer;
    display: flex;
  }
  .login-close svg { width: 24px; height: 24px; }

  .login-field {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #232325;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 14px;
    border: 1.5px solid transparent;
    transition: border-color 0.2s ease, background 0.2s ease;
    height: 56px;
  }
  .login-field:focus-within {
    background: #1e1e20;
  }
  .field-inner {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 32px;
  }
  .field-inner label {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    color: #9a9a9a;
    font-size: 15px;
    pointer-events: none;
    transition: top 0.15s ease, transform 0.15s ease, font-size 0.15s ease;
    transform-origin: left top;
  }
  .field-inner input {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: none;
    border: none;
    outline: none;
    color: #ffffff;
    font-size: 15px;
    width: 100%;
    height: 20px;
  }
  .field-inner input:focus ~ label,
  .field-inner input:not(:placeholder-shown) ~ label {
    top: 0;
    transform: translateY(0);
    font-size: 12px;
  }
  .toggle-eye {
    background: none;
    border: none;
    color: #9a9a9a;
    cursor: pointer;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .toggle-eye.show {
    opacity: 1;
    pointer-events: auto;
  }
  .toggle-eye svg { width: 20px; height: 20px; }
  .login-field svg {
    width: 20px;
    height: 20px;
    color: #9a9a9a;
    flex-shrink: 0;
  }

  .forgot-pass {
    text-align: right;
    margin-bottom: 18px;
  }
  .forgot-pass a {
    color: #2f7bff;
    font-size: 14px;
    text-decoration: none;
    font-weight: 600;
  }

  .btn-login-submit {
    width: 100%;
    background: #23c65b;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 22px;
  }
  .btn-login-submit:hover {
    background: #1fae4f;
  }

  .or-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #8a8a8e;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .or-divider::before,
  .or-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #2c2c2e;
  }

  .social-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .social-btn {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #232325;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #ffffff;
  }
  .social-btn svg { width: 22px; height: 22px; }

  .signup-line {
    text-align: center;
    color: #b0b0b0;
    font-size: 14px;
  }
  .signup-line a {
    color: #2f7bff;
    font-weight: 700;
    text-decoration: none;
    display: block;
    margin-top: 4px;
  }

  .field-hint {
    color: #9a9a9a;
    font-size: 13px;
    margin: -8px 0 16px 4px;
  }
  .promo-link {
    margin-bottom: 20px;
  }
  .promo-link a {
    color: #2f7bff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
  }
  .terms-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 22px;
  }
  .terms-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-top: 2px;
    accent-color: #23c65b;
    flex-shrink: 0;
  }
  .terms-row label {
    color: #d0d0d0;
    font-size: 14px;
    line-height: 1.4;
  }
  .terms-row a {
    color: #2f7bff;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>

  <div class="login-sheet" id="loginSheet">

    <div class="signup-line">

  <div class="login-sheet" id="registerSheet">
    <div class="login-header">
      <h2>Pendaftaran</h2>
      <button class="login-close" id="registerClose">

      <button class="btn btn-daftar" id="daftarBtn">Pendaftaran</button>

  <div class="overlay" id="overlay"></div>

  <button class="drawer-close" id="drawerClose">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>

  <div class="drawer" id="drawer">

      <div class="drawer-user">
        <div class="avatar">

      </div>

    </div>

    <div class="drawer-divider"></div>

    <button class="drawer-item">

    <button class="drawer-item">
      <div class="drawer-item-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><polygon points="12,8 14.3,9.7 13.4,12.4 10.6,12.4 9.7,9.7" fill="currentColor" stroke="none"/></svg>
        <span>Olahraga</span>
      </div>

    </button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><line x1="12" y1="4" x2="12" y2="6.5"/><line x1="12" y1="17.5" x2="12" y2="20"/><line x1="4" y1="12" x2="6.5" y2="12"/><line x1="17.5" y1="12" x2="20" y2="12"/><line x1="6.5" y1="6.5" x2="8.2" y2="8.2"/><line x1="15.8" y1="15.8" x2="17.5" y2="17.5"/><line x1="6.5" y1="17.5" x2="8.2" y2="15.8"/><line x1="15.8" y1="8.2" x2="17.5" y2="6.5"/></svg>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const menuBtn = document.getElementById('menuBtn');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    const drawerClose = document.getElementById('drawerClose');

    function openDrawer() {
      drawer.classList.add('show');
      overlay.classList.add('show');
      drawerClose.classList.add('show');
    }
    function closeDrawer() {
      drawer.classList.remove('show');
      overlay.classList.remove('show');
      drawerClose.classList.remove('show');
    }

    menuBtn.addEventListener('click', openDrawer);
    drawerClose.addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);

    const masukBtn = document.getElementById('masukBtn');
    const loginSheet = document.getElementById('loginSheet');
    const loginOverlay = document.getElementById('loginOverlay');
    const loginClose = document.getElementById('loginClose');

    function openLogin() {
      loginSheet.classList.add('show');
      loginOverlay.classList.add('show');
    }
    function closeLogin() {
      loginSheet.classList.remove('show');
      loginOverlay.classList.remove('show');
    }

    masukBtn.addEventListener('click', openLogin);
    loginClose.addEventListener('click', closeLogin);
    loginOverlay.addEventListener('click', closeLogin);

    const masukRow = document.getElementById('masukRow');
    masukRow.addEventListener('click', function() {
      closeDrawer();
      openLogin();
    });

    const daftarBtn = document.getElementById('daftarBtn');
    const registerSheet = document.getElementById('registerSheet');
    const registerOverlay = document.getElementById('registerOverlay');
    const registerClose = document.getElementById('registerClose');

    function openRegister() {
      registerSheet.classList.add('show');
      registerOverlay.classList.add('show');
    }
    function closeRegister() {
      registerSheet.classList.remove('show');
      registerOverlay.classList.remove('show');
    }

    daftarBtn.addEventListener('click', openRegister);
    registerClose.addEventListener('click', closeRegister);
    registerOverlay.addEventListener('click', closeRegister);

    // Toggle mata (show/hide password)
    document.querySelectorAll('.toggle-eye').forEach(function(btn) {
      const input = document.getElementById(btn.dataset.target);
      input.addEventListener('input', function() {
        if (input.value.length > 0) {
          btn.classList.add('show');
        } else {
          btn.classList.remove('show');
        }
      });
      btn.addEventListener('click', function() {
        if (input.type === 'password') {
          input.type = 'text';
        } else {
          input.type = 'password';
        }
      });
    });

    // ---- Supabase Auth ----
    const SUPABASE_URL = "https://xvvnnqpjiyervgnyffqs.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Qp9izsQ77Ym9vzSBxwd--A_AZxfy4vs";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function setMsg(el, text, isError) {
      el.textContent = text;
      el.style.color = isError ? "#ff5c5c" : "#23c65b";
    }

    // Daftar (Sign Up)
    const registerSubmitBtn = document.getElementById('registerSubmitBtn');
    const registerMsg = document.getElementById('registerMsg');
    registerSubmitBtn.addEventListener('click', async function() {
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPass').value;
      const agreed = document.getElementById('termsCheck').checked;

      if (!email || !password) {
        setMsg(registerMsg, "Isi email dan kata sandi dulu.", true);
        return;
      }
      if (password.length < 8) {
        setMsg(registerMsg, "Kata sandi minimal 8 karakter.", true);
        return;
      }
      if (!agreed) {
        setMsg(registerMsg, "Setujui perjanjian pengguna dulu.", true);
        return;
      }

      registerSubmitBtn.disabled = true;
      setMsg(registerMsg, "Memproses...", false);

      const { data, error } = await sb.auth.signUp({ email, password });

      registerSubmitBtn.disabled = false;

      if (error) {
        setMsg(registerMsg, error.message, true);
      } else {
        setMsg(registerMsg, "Berhasil daftar! Cek email untuk verifikasi.", false);
      }
    });

    // Masuk (Sign In)
    const loginSubmitBtn = document.getElementById('loginSubmitBtn');
    const loginMsg = document.getElementById('loginMsg');
    loginSubmitBtn.addEventListener('click', async function() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPass').value;

      if (!email || !password) {
        setMsg(loginMsg, "Isi email dan kata sandi dulu.", true);
        return;
      }

      loginSubmitBtn.disabled = true;
      setMsg(loginMsg, "Memproses...", false);

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      loginSubmitBtn.disabled = false;

      if (error) {
        setMsg(loginMsg, error.message, true);
      } else {
        setMsg(loginMsg, "Berhasil masuk!", false);
        setTimeout(closeLogin, 800);
      }
    });

    // Pantau status login, ubah tombol header jika sudah login
    sb.auth.onAuthStateChange((event, session) => {
      if (session) {
        masukBtn.textContent = session.user.email.split('@')[0];
        daftarBtn.textContent = "Keluar";
        daftarBtn.onclick = async function() {
          await sb.auth.signOut();
          location.reload();
        };
      }
    });
  </script>
</body>
</html>
